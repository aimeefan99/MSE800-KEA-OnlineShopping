{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-4">
  <div class="col-md-8">
    <h2 class="mb-4">Edit Your Listing</h2>
    
    <form action="{{ url_for('listings.handle_edit_listing', listing_id=listing.id) }}" method="POST">
      <div class="mb-3">
        <label class="form-label">Product Title</label>
        <input type="text" name="title" class="form-control" value="{{ listing.title }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Asking Price ($)</label>
        <input type="number" step="0.01" name="price" class="form-control" value="{{ listing.price }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Condition</label>
        <select name="condition" class="form-select" required>
          <option value="New" {% if listing.condition == 'New' %}selected{% endif %}>New / Brand New</option>
          <option value="Like New" {% if listing.condition == 'Like New' %}selected{% endif %}>Like New / Excellent</option>
          <option value="Used" {% if listing.condition == 'Used' %}selected{% endif %}>Used / Minor Wear</option>
          <option value="Heavily Used" {% if listing.condition == 'Heavily Used' %}selected{% endif %}>Heavily Used / Damaged</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Item Description</label>
        <textarea name="description" class="form-control" rows="5" required>{{ listing.description }}</textarea>
      </div>
      <div class="d-flex gap-3">
        <a href="{{ url_for('listings.view_listing_detail_page', listing_id=listing.id) }}" class="btn btn-secondary w-50">Cancel</a>
        <button type="submit" class="btn btn-success w-50">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
