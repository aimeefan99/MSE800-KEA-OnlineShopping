{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-4">
  <div class="col-md-8">
    <h2 class="mb-4">Edit Your Listing</h2>
    
    <form action="{{ url_for('listings.handle_edit_listing', listing_id=listing.id) }}" method="POST">
      <div class="mb-3">
        <label class="form-label">Product Title</label>
        <input type="text" name="title" class="form-control" value="{{ listing.title }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="category_id">Category</label>
        <select class="form-select" id="category_id" name="category_id" required>
          {% for category in categories %}
            <option
              value="{{ category.id }}"
              {% if listing.category_id == category.id %}selected{% endif %}
            >
              {{ category.name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Asking Price ($)</label>
        <input type="number" step="0.01" name="price" class="form-control" value="{{ listing.price }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Condition</label>
        <select name="condition" class="form-select" required>
          {% for condition in condition_options %}
            <option value="{{ condition }}" {% if listing.condition == condition %}selected{% endif %}>
              {{ condition|title }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" for="status">Listing Status</label>
        <select class="form-select" id="status" name="status" required>
          {% for status in status_options %}
            <option value="{{ status }}" {% if listing.status == status %}selected{% endif %}>
              {{ status|title }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Item Description</label>
        <textarea name="description" class="form-control" rows="5" required>{{ listing.description }}</textarea>
      </div>
      <div class="d-flex gap-3">
        <a href="{{ url_for('listings.view_listing_detail', listing_id=listing.id) }}" class="btn btn-secondary w-50">Cancel</a>
        <button type="submit" class="btn btn-success w-50">Save Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
