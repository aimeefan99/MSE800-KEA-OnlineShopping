{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2 class="mb-4">List an Item for Sale</h2>
    
    <form action="{{ url_for('listings.handle_create_listing') }}" method="POST">
      <div class="mb-3">
        <label class="form-label">Product Title *</label>
        <input type="text" name="title" class="form-control" required placeholder="e.g. iPhone 13 Pro Max">
      </div>
      <div class="mb-3">
        <label class="form-label">Asking Price ($ NZD) *</label>
        <input type="number" step="0.01" name="price" class="form-control" required placeholder="0.00">
      </div>
      <div class="mb-3">
        <label class="form-label">Condition *</label>
        <select name="condition" class="form-select" required>
          <option value="New">New / Brand New</option>
          <option value="Like New">Like New / Excellent</option>
          <option value="Used">Used / Minor Wear</option>
          <option value="Heavily Used">Heavily Used / Damaged</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Item Description *</label>
        <textarea name="description" class="form-control" rows="5" required placeholder="Provide details about the item's condition, pickup info, etc."></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Publish Listing</button>
    </form>
  </div>
</div>
{% endblock %}
