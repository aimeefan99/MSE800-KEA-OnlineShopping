{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-5">
    <div class="card p-4 shadow-sm">
      <h2 class="mb-4 text-center fw-bold">Account Login</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('auth.login') }}" method="POST">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-success w-100 py-2">Log In</button>
      </form>
      <p class="mt-3 text-center mb-0">Don't have an account? <a href="{{ url_for('auth.register_page') }}">Register here</a></p>
    </div>
  </div>
</div>
{% endblock %}
