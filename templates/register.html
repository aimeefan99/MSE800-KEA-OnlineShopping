{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-4">
  <div class="col-md-6">
    <div class="card p-4 shadow-sm">
      <h2 class="mb-4 text-center fw-bold">Create Account</h2>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('auth.register') }}" method="POST">
        <div class="mb-3">
          <label class="form-label">Public Display Name *</label>
          <input type="text" name="display_name" class="form-control" required placeholder="e.g. JohnDoe">
        </div>
        <div class="mb-3">
          <label class="form-label">Full Legal Name *</label>
          <input type="text" name="full_name" class="form-control" required placeholder="John David Doe">
        </div>
        <div class="mb-3">
          <label class="form-label">Date of Birth *</label>
          <input type="date" name="date_of_birth" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address *</label>
          <input type="email" name="email" class="form-control" required placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Phone Number (Optional)</label>
          <input type="text" name="phone_number" class="form-control" placeholder="021 000 0000">
        </div>
        <div class="mb-3">
          <label class="form-label">Preferred Contact Method *</label>
          <select name="preferred_contact_method" class="form-select" required>
            <option value="email">Email</option>
            <option value="phone">Phone / Text</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Password *</label>
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>
      </form>
      <p class="mt-3 text-center mb-0">Already have an account? <a href="{{ url_for('auth.login_page') }}">Log in here</a></p>
    </div>
  </div>
</div>
{% endblock %}
