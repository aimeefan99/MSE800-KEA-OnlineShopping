{% if purchase_request.can_review %}
    <form
        class="mt-4 border-top pt-3"
        action="{{ url_for('transactions.create_review') }}"
        method="post"
    >
        <input
            type="hidden"
            name="request_id"
            value="{{ purchase_request.id }}"
        >
        <input
            type="hidden"
            name="reviewed_user_id"
            value="{{ purchase_request.reviewed_user_id }}"
        >
        <h4 class="h6 mb-3">
            Review
            <a
                class="text-decoration-none"
                href="{{
                    url_for(
                        'profiles.view_public_profile',
                        user_id=purchase_request.reviewed_user_id
                    )
                }}"
            >
                {{ purchase_request.reviewed_user_name }}
            </a>
        </h4>
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label
                    class="form-label"
                    for="{{ review_form_prefix }}-score-{{ purchase_request.id }}"
                >
                    Rating
                </label>
                <select
                    class="form-select"
                    id="{{ review_form_prefix }}-score-{{ purchase_request.id }}"
                    name="score"
                    required
                >
                    <option value="">Select</option>
                    {% for score in [5, 4, 3, 2, 1] %}
                        <option value="{{ score }}">{{ score }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-7">
                <label
                    class="form-label"
                    for="{{ review_form_prefix }}-comment-{{ purchase_request.id }}"
                >
                    Comment
                </label>
                <input
                    class="form-control"
                    id="{{ review_form_prefix }}-comment-{{ purchase_request.id }}"
                    name="comment"
                    type="text"
                    maxlength="500"
                >
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" type="submit">
                    Submit
                </button>
            </div>
        </div>
    </form>
{% elif purchase_request.has_reviewed %}
    <p class="text-success mt-3 mb-0">Review submitted.</p>
{% endif %}
