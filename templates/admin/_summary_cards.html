<div class="admin-summary-grid mb-4">
    <div class="admin-summary-card">
        <span class="admin-summary-label">Total Users</span>
        <strong class="admin-summary-value">{{ admin_summary.total_users }}</strong>
    </div>
    <div class="admin-summary-card">
        <span class="admin-summary-label">Locked Users</span>
        <strong class="admin-summary-value">{{ admin_summary.locked_users }}</strong>
    </div>
    <div class="admin-summary-card">
        <span class="admin-summary-label">Active Listings</span>
        <strong class="admin-summary-value">{{ admin_summary.active_listings }}</strong>
    </div>
    <div class="admin-summary-card">
        <span class="admin-summary-label">Completed Requests</span>
        <strong class="admin-summary-value">
            {{ admin_summary.completed_requests }}
        </strong>
    </div>
</div>
